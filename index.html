<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EECS 312 — 4x4 Multiplier Leaderboard</title>
  <style>
    body {
      background: #000;
      color: #eee;
      font-family: monospace;
      padding: 24px;
      margin: 0;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0 0 16px 0;
      color: #fff;
    }
    .controls {
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    input, select {
      background: #111;
      color: #eee;
      border: 1px solid #333;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 0.9rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #222;
      text-align: right;
    }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }
    th {
      color: #888;
      cursor: pointer;
      user-select: none;
    }
    th:hover {
      color: #fff;
    }
    tr:hover {
      background: #0a0a0a;
    }
    .footer {
      margin-top: 24px;
      color: #555;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>EECS 312 — 4x4 Multiplier Leaderboard (IBM cmos10lpe)</h1>

  <div class="controls">
    <input type="text" id="search" placeholder="Search uniqname..." oninput="renderTable()">
    <select id="sortCol" onchange="renderTable()">
      <option value="j">Sort by: Objective J = E*D^2*A</option>
      <option value="e">Sort by: Energy (E)</option>
      <option value="d">Sort by: Delay (D)</option>
      <option value="area">Sort by: MOS Area (A)</option>
      <option value="mos">Sort by: MOS Fingers</option>
      <option value="uniqname">Sort by: Uniqname</option>
    </select>
    <select id="sortDir" onchange="renderTable()">
      <option value="asc">Lowest to Highest</option>
      <option value="desc">Highest to Lowest</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th onclick="setSort('rank')">Rank</th>
        <th onclick="setSort('uniqname')">Uniqname</th>
        <th onclick="setSort('j')">J = E * D^2 * A (J*s^2*um^2)</th>
        <th onclick="setSort('e')">Energy (fJ)</th>
        <th onclick="setSort('d')">Delay (ns)</th>
        <th onclick="setSort('area')">Area (um^2)</th>
        <th onclick="setSort('mos')">Fingers</th>
        <th onclick="setSort('pass')">Vectors</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody"></tbody>
  </table>

  <div class="footer">
    Evaluated with Cadence Spectre using 256 random input vectors.<br>
    Formula: J = Energy/op (J) * (Settling Delay (s))^2 * MOS Gate Area (um^2).
  </div>

  <script>
    const data = [{"rank": 1, "uniqname": "chenalb", "j": 3.365925765578407e-30, "e": 114.90623189481981, "d": 1.3152114111702338, "area": 16.934400000000004, "mos": 392, "pass": "256/256"}, {"rank": 2, "uniqname": "bany", "j": 1.2296150366611456e-28, "e": 397.7173625641498, "d": 1.5987347624566821, "area": 120.95999999999766, "mos": 1344, "pass": "256/256"}];

    function setSort(col) {
      const colSelect = document.getElementById('sortCol');
      const dirSelect = document.getElementById('sortDir');
      if (colSelect.value === col) {
        dirSelect.value = dirSelect.value === 'asc' ? 'desc' : 'asc';
      } else {
        colSelect.value = col;
        dirSelect.value = 'asc';
      }
      renderTable();
    }

    function renderTable() {
      const query = document.getElementById('search').value.toLowerCase().trim();
      const col = document.getElementById('sortCol').value;
      const dir = document.getElementById('sortDir').value;

      let filtered = data.filter(r => r.uniqname.toLowerCase().includes(query));

      filtered.sort((a, b) => {
        let v1 = a[col], v2 = b[col];
        if (typeof v1 === 'string') {
          v1 = v1.toLowerCase();
          v2 = v2.toLowerCase();
        }
        if (v1 < v2) return dir === 'asc' ? -1 : 1;
        if (v1 > v2) return dir === 'asc' ? 1 : -1;
        return 0;
      });

      const tb = document.getElementById('leaderboardBody');
      if (filtered.length === 0) {
        tb.innerHTML = '<tr><td colspan="8">No matching submissions.</td></tr>';
        return;
      }

      tb.innerHTML = filtered.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${r.uniqname}</td>
          <td>${r.j.toExponential(4)}</td>
          <td>${r.e.toFixed(2)}</td>
          <td>${r.d.toFixed(3)}</td>
          <td>${r.area.toFixed(2)}</td>
          <td>${r.mos}</td>
          <td>${r.pass}</td>
        </tr>
      `).join('');
    }

    renderTable();
  </script>
</body>
</html>
