<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EECS 312 — 4x4 Multiplier Leaderboard</title>
  <style>
    body {
      background: #000;
      color: #eee;
      font-family: monospace;
      padding: 24px;
      margin: 0;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0 0 16px 0;
      color: #fff;
    }
    .controls {
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    input, select {
      background: #111;
      color: #eee;
      border: 1px solid #333;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 0.9rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid #222;
      text-align: right;
    }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }
    th {
      color: #888;
      cursor: pointer;
      user-select: none;
    }
    th:hover {
      color: #fff;
    }
    tr:hover {
      background: #0a0a0a;
    }
    .footer {
      margin-top: 24px;
      color: #555;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>EECS 312 — 4x4 Multiplier Leaderboard (IBM cmos10lpe)</h1>

  <div class="controls">
    <input type="text" id="search" placeholder="Search uniqname..." oninput="renderTable()">
    <select id="sortCol" onchange="renderTable()">
      <option value="j">Sort by: Objective J = E*D^2*A</option>
      <option value="e">Sort by: Energy (E)</option>
      <option value="d">Sort by: Delay (D)</option>
      <option value="area">Sort by: MOS Area (A)</option>
      <option value="mos">Sort by: MOS Fingers</option>
      <option value="uniqname">Sort by: Uniqname</option>
    </select>
    <select id="sortDir" onchange="renderTable()">
      <option value="asc">Lowest to Highest</option>
      <option value="desc">Highest to Lowest</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th onclick="setSort('rank')">Rank</th>
        <th onclick="setSort('uniqname')">Uniqname</th>
        <th onclick="setSort('j')">J = E * D^2 * A (J*s^2*um^2)</th>
        <th onclick="setSort('e')">Energy (fJ)</th>
        <th onclick="setSort('d')">Delay (ns)</th>
        <th onclick="setSort('area')">Area (um^2)</th>
        <th onclick="setSort('mos')">Fingers</th>
        <th onclick="setSort('pass')">Vectors</th>
      </tr>
    </thead>
    <tbody id="leaderboardBody"></tbody>
  </table>

  <div class="footer">
    Evaluated with Cadence Spectre using 256 random input vectors.<br>
    Formula: J = Energy/op (J) * (Settling Delay (s))^2 * MOS Gate Area (um^2).
  </div>

  <script>
    const data = [{"rank": 1, "uniqname": "rogerhui", "j": 8.459842124381231e-32, "e": 50.818457020209735, "d": 0.6855223084791789, "area": 3.542399999999998, "mos": 472, "pass": "256/256"}, {"rank": 2, "uniqname": "iancao", "j": 1.003067714676279e-31, "e": 53.45062314986747, "d": 0.6846759856945119, "area": 4.0032000000000005, "mos": 536, "pass": "256/256"}, {"rank": 3, "uniqname": "johnspit", "j": 1.271202921264204e-31, "e": 53.150952898275314, "d": 0.9205399307528176, "area": 2.822400000000002, "mos": 392, "pass": "256/256"}, {"rank": 4, "uniqname": "kuobenji", "j": 1.3214193682876426e-31, "e": 61.76828514568916, "d": 0.7336717126343448, "area": 3.974399999999998, "mos": 368, "pass": "256/256"}, {"rank": 5, "uniqname": "bczarnec", "j": 1.8446832379073424e-31, "e": 67.3546802868058, "d": 0.7832761777252568, "area": 4.464000000000001, "mos": 392, "pass": "256/256"}, {"rank": 6, "uniqname": "gvu", "j": 2.0330490324185625e-31, "e": 64.54782475812509, "d": 0.8454562939240243, "area": 4.406400000000002, "mos": 392, "pass": "256/256"}, {"rank": 7, "uniqname": "rkleinin", "j": 4.226633080915851e-31, "e": 67.03448978874665, "d": 1.2245469699941596, "area": 4.204800000000001, "mos": 584, "pass": "256/256"}, {"rank": 8, "uniqname": "adejman", "j": 4.923864690613936e-31, "e": 99.84929177694484, "d": 0.7724019620280467, "area": 8.265600000000003, "mos": 600, "pass": "256/256"}, {"rank": 9, "uniqname": "vaap", "j": 5.827578211390939e-31, "e": 93.16360257135699, "d": 0.8760551696496102, "area": 8.150400000000007, "mos": 392, "pass": "256/256"}, {"rank": 10, "uniqname": "ethancon", "j": 5.930813718338289e-31, "e": 81.63390231451943, "d": 0.9831173610716468, "area": 7.516800000000001, "mos": 392, "pass": "256/256"}, {"rank": 11, "uniqname": "derekgao", "j": 5.970462858336426e-31, "e": 115.7757717886123, "d": 0.7235788452016934, "area": 9.849600000000002, "mos": 456, "pass": "256/256"}, {"rank": 12, "uniqname": "yojacob", "j": 6.475119742589889e-31, "e": 101.60388202591452, "d": 0.8368140553171639, "area": 9.100800000000001, "mos": 632, "pass": "256/256"}, {"rank": 13, "uniqname": "nathanyw", "j": 8.215518499630197e-31, "e": 113.29133792554657, "d": 1.003582056842415, "area": 7.2, "mos": 704, "pass": "256/256"}, {"rank": 14, "uniqname": "yoonseok", "j": 8.215518499630197e-31, "e": 113.29133792554657, "d": 1.003582056842415, "area": 7.2, "mos": 704, "pass": "256/256"}, {"rank": 15, "uniqname": "pickos", "j": 1.6151125893960915e-30, "e": 117.50260266296928, "d": 1.0367879216289215, "area": 12.787200000000006, "mos": 336, "pass": "256/256"}, {"rank": 16, "uniqname": "jimmyliu", "j": 2.539986205352336e-30, "e": 197.35775571274092, "d": 0.8172958191331756, "area": 19.267200000000006, "mos": 456, "pass": "256/256"}, {"rank": 17, "uniqname": "chenalb", "j": 3.365925765578407e-30, "e": 114.90623189481981, "d": 1.3152114111702338, "area": 16.934400000000004, "mos": 392, "pass": "256/256"}, {"rank": 18, "uniqname": "vaibh", "j": 7.970331275498553e-30, "e": 415.2153473986221, "d": 0.6022704698970541, "area": 52.92, "mos": 392, "pass": "256/256"}, {"rank": 19, "uniqname": "nguyener", "j": 1.364745847768857e-29, "e": 206.25174141994356, "d": 1.4196405937658474, "area": 32.83200000000002, "mos": 456, "pass": "256/256"}, {"rank": 20, "uniqname": "bany", "j": 1.2296150366611456e-28, "e": 397.7173625641498, "d": 1.5987347624566821, "area": 120.95999999999766, "mos": 1344, "pass": "256/256"}, {"rank": 21, "uniqname": "akandhai", "j": 8.899896203748077e-28, "e": 76895.38640930748, "d": 0.7615167631097782, "area": 19.958400000000008, "mos": 472, "pass": "256/256"}];

    function setSort(col) {
      const colSelect = document.getElementById('sortCol');
      const dirSelect = document.getElementById('sortDir');
      if (colSelect.value === col) {
        dirSelect.value = dirSelect.value === 'asc' ? 'desc' : 'asc';
      } else {
        colSelect.value = col;
        dirSelect.value = 'asc';
      }
      renderTable();
    }

    function renderTable() {
      const query = document.getElementById('search').value.toLowerCase().trim();
      const col = document.getElementById('sortCol').value;
      const dir = document.getElementById('sortDir').value;

      let filtered = data.filter(r => r.uniqname.toLowerCase().includes(query));

      filtered.sort((a, b) => {
        let v1 = a[col], v2 = b[col];
        if (typeof v1 === 'string') {
          v1 = v1.toLowerCase();
          v2 = v2.toLowerCase();
        }
        if (v1 < v2) return dir === 'asc' ? -1 : 1;
        if (v1 > v2) return dir === 'asc' ? 1 : -1;
        return 0;
      });

      const tb = document.getElementById('leaderboardBody');
      if (filtered.length === 0) {
        tb.innerHTML = '<tr><td colspan="8">No matching submissions.</td></tr>';
        return;
      }

      tb.innerHTML = filtered.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${r.uniqname}</td>
          <td>${r.j.toExponential(4)}</td>
          <td>${r.e.toFixed(2)}</td>
          <td>${r.d.toFixed(3)}</td>
          <td>${r.area.toFixed(2)}</td>
          <td>${r.mos}</td>
          <td>${r.pass}</td>
        </tr>
      `).join('');
    }

    renderTable();
  </script>
</body>
</html>
